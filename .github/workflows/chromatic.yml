# Chromatic visual tests — separate from CI per https://www.chromatic.com/docs/github-actions/
# Prefer `push` (not pull_request) so baselines track real branch commits, not ephemeral merge SHAs.
name: Chromatic

on:
  push:

jobs:
  chromatic:
    name: Run Chromatic
    runs-on: ubuntu-latest
    # Forks cannot use repo secrets.
    if: github.repository == github.event.repository.full_name
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Publish to Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # Match package.json `chromatic` script: review changes in the Chromatic UI
          # without failing the workflow on first visual diffs.
          exitZeroOnChanges: true
